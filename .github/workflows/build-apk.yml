name: Build Android APK

on:
  workflow_dispatch:  # Nur manueller Trigger - zuverlässiger

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK using pre-built container
        uses: docker://kivy/buildozer:v1.5.0
        with:
          entrypoint: /bin/bash
          args: |
            -c '
            set -e
            cd /host
            echo "=== Build Starting ==="
            buildozer android clean 2>/dev/null || true
            buildozer android debug 2>&1 || {
              echo "Build failed!"
              exit 1
            }
            echo "=== Build Complete ==="
            '
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: docscanner.apk
          path: bin/*.apk