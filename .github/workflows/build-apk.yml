name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug - Show buildozer.spec BEFORE build
        run: |
          echo "=== CONTENTS OF buildozer.spec ==="
          cat buildozer.spec
          echo "=== REQUIREMENTS LINE ==="
          grep "^requirements" buildozer.spec
          echo "=========================================="
      
      - name: Install pip requirements
        run: |
          pip3 install --upgrade pip
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt || echo "Requirements install failed"
          fi
      
      - name: Clean previous builds
        run: |
          buildozer android clean || echo "Clean failed"
      
      - name: Build Debug APK
        run: |
          echo "Starting build at $(date)"
          echo "Current directory: $(pwd)"
          echo "Files: $(ls -la)"
          buildozer android debug
          echo "Build finished at $(date)"
          ls -lh bin/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: docscanner-debug.apk
          path: bin/*.apk
          retention-days: 30