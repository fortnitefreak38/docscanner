name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean .buildozer cache (force fresh build)
        run: |
          echo "Removing old .buildozer cache..."
          rm -rf .buildozer
          echo "Cache removed. Starting fresh."
          ls -la
      
      - name: Show buildozer.spec
        run: |
          echo "=== CURRENT buildozer.spec ==="
          cat buildozer.spec
          echo "=== REQUIREMENTS LINE ==="
          grep "^requirements" buildozer.spec
      
      - name: Install pip requirements
        run: |
          pip3 install --upgrade pip
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt || echo "Requirements install failed"
          fi
      
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd24f5443a1d50f65e5a59cb1c3e98e8c4e0e0e0e" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "Licenses accepted"
      
      - name: Build Debug APK
        run: |
          echo "Starting build at $(date)"
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          buildozer android debug
          echo "Build finished at $(date)"
          ls -lh bin/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: docscanner-debug.apk
          path: bin/*.apk
          retention-days: 30