name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            build-essential \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            autoconf \
            automake \
            libtool \
            cmake \
            git \
            wget \
            unzip \
            openjdk-17-jdk \
            android-sdk-build-tools
          sudo rm -rf /var/lib/apt/lists/*
      
      - name: Set up Android SDK
        run: |
          mkdir -p ~/.android/sdk
          export ANDROID_HOME=~/.android/sdk
          export ANDROID_SDK_ROOT=~/.android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install -r requirements.txt
      
      - name: Build APK with Buildozer
        id: build
        run: |
          set -e
          echo "=== Starting Buildozer Build ==="
          date
          
          # Clean previous builds
          echo "Cleaning previous builds..."
          buildozer android clean 2>&1 | tee -a build.log || true
          
          # Build with full logging
          echo "Building debug APK..."
          buildozer -v android debug 2>&1 | tee -a build.log
          
          echo "=== Build completed ==="
          date
          
          # Show last 100 lines of log if build failed
          if [ $? -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "❌ BUILD FAILED - Last 100 lines of log:"
            echo "========================================="
            tail -n 100 build.log
            echo ""
            echo "========================================="
            echo "Searching for ERROR in full log:"
            echo "========================================="
            grep -i "error\|exception\|failed" build.log | tail -n 50
            exit 1
          fi
        continue-on-error: false
      
      - name: Save build log as artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-error-log
          path: build.log
          retention-days: 7
      
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docscanner-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}