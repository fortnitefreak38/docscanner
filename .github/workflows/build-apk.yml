name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Use pre-built Docker image with all Android dependencies
    runs-on: ubuntu-latest
    container: kivy/buildozer:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || echo "Requirements install failed, continuing..."
      
      - name: Show buildozer.spec
        run: cat buildozer.spec
      
      - name: Build APK
        id: build
        run: |
          echo "=== Starting Build ==="
          date
          
          # Set up environment
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_NDK_HOME=/opt/android-ndk
          export NDK_HOME=/opt/android-ndk
          
          # Clean
          buildozer android clean || true
          
          # Build with retries
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Build attempt $attempt of $MAX_ATTEMPTS..."
            if buildozer -v android debug; then
              echo "✓ Build successful on attempt $attempt"
              exit 0
            else
              echo "Attempt $attempt failed"
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                echo "Retrying in 30 seconds..."
                sleep 30
              fi
            fi
          done
          
          echo "❌ Build failed after $MAX_ATTEMPTS attempts"
          exit 1
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docscanner-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: |
            .buildozer/android/platform/build-*/dists/*/build.log
            .buildozer/android/platform/build-*/dist_build.log
          retention-days: 7